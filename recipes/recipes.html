
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recipe Book</title>

    <meta name="description" content="Discover delicious recipes.">

    <link rel="icon" href="favicon.ico">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="recipes.css">

    <script src="recipes.js" defer></script>
</head>

<body>

    <header>
        <div class="logo">
            <img src="images/recipe-book.png" alt="Recipe Book logo">
            <h1>Recipe Book</h1>
        </div>
    </header>

    <main>

        <section class="search">
            <form id="searchForm">

                <input
                    type="search"
                    id="searchInput"
                    placeholder="Find a recipe..."
                    aria-label="Find a recipe"
                >

                <button type="submit" aria-label="Search">
                    <img src="images/search.svg" alt="">
                </button>

            </form>
        </section>

        <section id="recipeContainer" class="recipe-container">
        </section>

    </main>

    <footer>

        <div class="social">

            <a href="#" aria-label="Instagram">
                <img src="images/instagram_icon.svg" alt="Instagram icon">
            </a>

            <a href="#" aria-label="YouTube">
                <img src="images/youtube_icon.svg" alt="YouTube icon">
            </a>

            <a href="#" aria-label="Pinterest">
                <img src="images/pinterest_icon.svg" alt="Pinterest icon">
            </a>

        </div>

        <div class="attribution">
            <a href="https://www.flaticon.com/free-icons/recipe">
                Recipe icons created by Freepik - Flaticon
            </a>
        </div>

    </footer>

</body>
</html>
